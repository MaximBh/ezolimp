<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
  </defs>
  <!-- Внешний шестиугольник (обводка) -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#hexGrad)" stroke-width="8" stroke-linejoin="round" />
  <!-- Внутренние линии к центру -->
  <line x1="10" y1="27.5" x2="50" y2="50" stroke="url(#hexGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="90" y1="27.5" x2="50" y2="50" stroke="url(#hexGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="95" x2="50" y2="50" stroke="url(#hexGrad)" stroke-width="6" stroke-linecap="round" />
  <!-- Центральная точка -->
  <circle cx="50" cy="50" r="10" fill="#a855f7" />
</svg>
